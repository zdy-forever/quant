name: ChatGPT A-share dual backtest
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python chatgpt_backtest/ashare_bt.py
      - name: Commit results to temporary branch
        run: |
          git config user.name chatgpt-backtest-bot
          git config user.email chatgpt-backtest-bot@users.noreply.github.com
          git add chatgpt_backtest/output
          git commit -m "Backtest results [skip ci]" || exit 0
          git push origin HEAD:${{ github.head_ref }}
