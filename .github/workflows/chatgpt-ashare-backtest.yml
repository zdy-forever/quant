name: ChatGPT A-share funded backtest
on:
  push:
    branches: [chatgpt-ashare-funded-20260823]
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python -m chatgpt_backtest.ashare_bt_funded
      - name: Commit results
        run: |
          git config user.name chatgpt-backtest-bot
          git config user.email chatgpt-backtest-bot@users.noreply.github.com
          git add chatgpt_backtest/output
          git commit -m "Backtest funded results [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
