name: ChatGPT A-share dual backtest
on:
  push:
    branches: [chatgpt-ashare-backtest-20260823]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python chatgpt_backtest/ashare_bt.py
      - uses: actions/upload-artifact@v4
        with:
          name: ashare-backtest-results
          path: chatgpt_backtest/output/
