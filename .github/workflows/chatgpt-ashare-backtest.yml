name: ChatGPT A-share benchmark
on:
  push:
    branches: [chatgpt-ashare-benchmark-20260823]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python chatgpt_backtest/benchmark_only.py
      - name: Commit benchmark result
        run: |
          git config user.name chatgpt-backtest-bot
          git config user.email chatgpt-backtest-bot@users.noreply.github.com
          git add chatgpt_backtest/output/benchmark_summary.json
          git commit -m "Benchmark results [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
