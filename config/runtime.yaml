regime:
  symbol_for_regime: "SPY"
  trend_fast: 20
  trend_slow: 100
  trend_threshold: 0.01
  vol_window: 20
  vol_threshold: 0.02
  mix_lookback_days: 60
  no_trade_in_range_high_vol: true

position:
  method: "vol_target"
  max_positions: 10
  target_vol_annual: 0.15
  vol_lookback: 20
  kelly_fraction: 0.25

risk:
  max_weight_per_asset: 0.12
  max_gross_exposure: 1.0
  max_drawdown: 0.25
  stop_loss_pct: 0.08
  take_profit_pct: 0.25
  slippage_bps: 5.0
  commission_bps: 0.0

backtest:
  max_positions: 10
  gross_exposure: 1.0
  rebalance_every_n_days: 1
  slippage_bps: 5.0
  commission_bps: 0.0
  stop_loss_pct: 0.08
  take_profit_pct: 0.25
  trailing_stop_atr_multiple: 3.0
  atr_window: 20
  max_holding_days: 120

optimizer:
  min_trade_count: 8
  min_avg_active_positions: 1.0
  max_avg_turnover: 1.5

strategy_mix:
  lookback_days: 60
  max_total_exposure: 1.0
  min_strategy_weight: 0.05
  high_vol_haircut: 0.35
  trend_strategies:
    - trend
    - turtle
    - pullback
    - low_vol_momentum
  range_strategies:
    - mean_reversion
  defensive_strategies:
    - low_vol_momentum

alpha_lab:
  forward_days:
    - 1
    - 5
    - 10
    - 20
  quantiles: 5
  top_n: 10
  min_ic: 0.02
  min_rank_ic: 0.03
